[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-lossless-radio-prototype"
version = "0.1.0"
description = "Account-backed feasibility gate for a personal YouTube Music / Tidal radio"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "ytmusicapi==1.12.3",
  "tidalapi==0.8.11",
  "requests==2.34.2",
  "defusedxml==0.7.1",
  "isodate==0.7.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.3"]

[project.scripts]
radio-prototype = "radio_prototype.cli:main"

[tool.setuptools.package-data]
radio_prototype = ["setup.html"]

[tool.setuptools.packages.find]
include = ["radio_prototype*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
